
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=AvgNewton03&show_icons=true&hide_border=true&bg_color=0D1117&title_color=5FAFA6&icon_color=5FAFA6&text_color=C9D1D9
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate language chart
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=AvgNewton03&layout=compact&langs_count=6&hide_border=true&bg_color=0D1117&title_color=5FAFA6&text_color=C9D1D9
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || (
            git commit -m "Update GitHub profile statistics" &&
            git push
          )
